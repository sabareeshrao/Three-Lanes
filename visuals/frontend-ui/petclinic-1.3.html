<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add container styling — Three-Lanes</title>
<link rel="stylesheet" href="../../styles/app.css">
<style>
:root{color-scheme:light}
html,body{margin:0;padding:0;background:#fff;color:#233746;min-height:100%;font-family:Inter,Arial,sans-serif}
[hidden]{display:none!important}
.micro-workbench{width:100%;margin:0;border-radius:0;min-height:350px}
.micro-stage{min-height:220px}
</style>
</head>
<body>
<div data-state="before" hidden><div class="micro-workbench"><div class="micro-header"><div><span class="micro-eyebrow">ONE CHANGE AT A TIME</span><h3>Container spacing</h3></div><span class="micro-step">1.3</span></div><div class="micro-compare"><button type="button" data-micro="toggle" data-value="before" class="chosen">Before</button><button type="button" data-micro="toggle" data-value="after" class="">After</button></div><div class="micro-stage"><div class="micro-measure"><span>← 50px →</span><div class="micro-spaced" style="margin-left:0px"><div class="micro-overline">OWNER PAGE SECTION</div><h3 class="micro-heading">Owners</h3><div class="micro-bar"/><div class="micro-bar short"/></div></div><p class="micro-note">Before: content has no new container offset.</p></div></div></div>
<div data-state="after"><div class="micro-workbench"><div class="micro-header"><div><span class="micro-eyebrow">ONE CHANGE AT A TIME</span><h3>Container spacing</h3></div><span class="micro-step">1.3</span></div><div class="micro-compare"><button type="button" data-micro="toggle" data-value="before" class="">Before</button><button type="button" data-micro="toggle" data-value="after" class="chosen">After</button></div><div class="micro-stage"><div class="micro-measure"><span>← 50px →</span><div class="micro-spaced" style="margin-left:50px"><div class="micro-overline">OWNER PAGE SECTION</div><h3 class="micro-heading">Owners</h3><div class="micro-bar"/><div class="micro-bar short"/></div></div><p class="micro-note">The container moves right and gains top spacing.</p></div></div></div>
<script>
document.addEventListener('click', function (event) {
  const control=event.target.closest('[data-micro="toggle"]');
  if(!control)return;
  const state=control.getAttribute('data-value')==='before'?'before':'after';
  for(const pane of document.querySelectorAll('[data-state]')){
    pane.hidden=pane.dataset.state!==state;
  }
});
</script>
</body></html>
