<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set HTML minimum date — Three-Lanes</title>
<link rel="stylesheet" href="../../styles/app.css">
<style>
:root{color-scheme:light}
html,body{margin:0;padding:0;background:#fff;color:#233746;min-height:100%;font-family:Inter,Arial,sans-serif}
[hidden]{display:none!important}
.micro-workbench{width:100%;margin:0;border-radius:0;min-height:350px}
.micro-stage{min-height:220px}
</style>
</head>
<body>
<div data-state="before" hidden><div class="micro-workbench"><div class="micro-header"><div><span class="micro-eyebrow">ONE CHANGE AT A TIME</span><h3>Minimum selectable date</h3></div><span class="micro-step">6.3</span></div><div class="micro-compare"><button type="button" data-micro="toggle" data-value="before" class="chosen">Before</button><button type="button" data-micro="toggle" data-value="after" class="">After</button></div><div class="micro-stage"><div class="micro-overline">DATE INPUT ELEMENT</div><form class="micro-form" id="microVisitForm"><label class="micro-label">Visit date<input type="date" name="date" value="2026-11-20" /></label><button type="submit" class="micro-primary">Save visit</button></form><p class="micro-note">Before: the input did not specify a minimum date.</p></div></div></div>
<div data-state="after"><div class="micro-workbench"><div class="micro-header"><div><span class="micro-eyebrow">ONE CHANGE AT A TIME</span><h3>Minimum selectable date</h3></div><span class="micro-step">6.3</span></div><div class="micro-compare"><button type="button" data-micro="toggle" data-value="before" class="">Before</button><button type="button" data-micro="toggle" data-value="after" class="chosen">After</button></div><div class="micro-stage"><div class="micro-overline">DATE INPUT ELEMENT</div><form class="micro-form" id="microVisitForm"><label class="micro-label">Visit date<input type="date" name="date" value="2026-11-20" min="2026-11-20"/></label><button type="submit" class="micro-primary">Save visit</button></form><p class="micro-note">After: the HTML input has a minimum date of tomorrow.</p></div></div></div>
<script>
document.addEventListener('click', function (event) {
  const control=event.target.closest('[data-micro="toggle"]');
  if(!control)return;
  const state=control.getAttribute('data-value')==='before'?'before':'after';
  for(const pane of document.querySelectorAll('[data-state]')){
    pane.hidden=pane.dataset.state!==state;
  }
});
</script>
</body></html>
