<text x="41" y="632" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#748898" font-weight="540">Click a visual element to view its precise source line; click again to close.</text><text x="48" y="161" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#158778" font-weight="840">OPENWEBTEXT CORPUS · THE ACTUAL TRANSFORMATIONS</text><g class="src" data-target="0" role="button" tabindex="0"><rect x="48" y="198" width="242" height="88" rx="12" stroke="#d1e1ea" stroke-width="1.4" fill="#eff6fc"/><rect x="61" y="212" width="5" height="60" rx="3" stroke="#139987" stroke-width="1.4" fill="#139987"/><text x="81" y="233" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="17" fill="#1c354b" font-weight="790">load_dataset</text><text x="81" y="256" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#667e90" font-weight="580">openwebtext</text></g><path d="M291 241H340" stroke="#5d9bb1" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#a)"/><g class="src" data-target="1" role="button" tabindex="0"><rect x="347" y="198" width="271" height="88" rx="12" stroke="#d1e1ea" stroke-width="1.4" fill="#eff8f3"/><rect x="360" y="212" width="5" height="60" rx="3" stroke="#139987" stroke-width="1.4" fill="#139987"/><text x="380" y="233" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="17" fill="#1c354b" font-weight="790">train_test_split</text><text x="380" y="256" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#667e90" font-weight="580">0.0005 validation fraction</text></g><path d="M620 241H674" stroke="#5d9bb1" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#a)"/><g class="src" data-target="2" role="button" tabindex="0"><rect x="679" y="198" width="345" height="88" rx="12" stroke="#d1e1ea" stroke-width="1.4" fill="#f1f0fc"/><rect x="692" y="212" width="5" height="60" rx="3" stroke="#139987" stroke-width="1.4" fill="#139987"/><text x="712" y="233" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="17" fill="#1c354b" font-weight="790">GPT-2 tokenization</text><text x="712" y="256" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#667e90" font-weight="580">encode_ordinary + eot_token</text></g><path d="M857 288V324H250V352" stroke="#5d9bb1" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#a)"/><g class="src" data-target="4" role="button" tabindex="0"><rect x="54" y="358" width="295" height="90" rx="12" stroke="#d1e1ea" stroke-width="1.4" fill="#eff6fc"/><rect x="67" y="372" width="5" height="62" rx="3" stroke="#139987" stroke-width="1.4" fill="#139987"/><text x="87" y="393" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="17" fill="#1c354b" font-weight="790">cumulative offsets</text><text x="87" y="416" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#667e90" font-weight="580">np.cumsum(dset[&apos;len&apos;])</text></g><path d="M349 400H392" stroke="#5d9bb1" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#a)"/><g class="src" data-target="5" role="button" tabindex="0"><rect x="400" y="358" width="275" height="90" rx="12" stroke="#d1e1ea" stroke-width="1.4" fill="#eff8f3"/><rect x="413" y="372" width="5" height="62" rx="3" stroke="#139987" stroke-width="1.4" fill="#139987"/><text x="433" y="393" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="17" fill="#1c354b" font-weight="790">mmap writes</text><text x="433" y="416" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#667e90" font-weight="580">np.uint16 · 2 bytes/token</text></g><path d="M676 400H719" stroke="#5d9bb1" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#a)"/><g class="src" data-target="6" role="button" tabindex="0"><rect x="727" y="358" width="292" height="90" rx="12" stroke="#d1e1ea" stroke-width="1.4" fill="#fff5e7"/><rect x="740" y="372" width="5" height="62" rx="3" stroke="#139987" stroke-width="1.4" fill="#139987"/><text x="760" y="393" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="17" fill="#1c354b" font-weight="790">binary data files</text><text x="760" y="416" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#667e90" font-weight="580">train.bin / val.bin</text></g><text x="65" y="499" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="15" fill="#2b4658" font-weight="730">Each document contributes its real tokenized length to a contiguous offset index.</text><text x="65" y="530" text-anchor="start" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#758a95" font-weight="580">No fabricated example document sizes or sampled token IDs are used here.</text></svg>
