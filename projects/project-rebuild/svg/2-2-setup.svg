<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="rebuild-2-2-setup-title rebuild-2-2-setup-desc" data-tl-diagram-id="rebuild-2-2-setup" data-design-version="1"><title id="rebuild-2-2-setup-title">Installable Python project</title><desc id="rebuild-2-2-setup-desc">Create a venv and install PyTorch with dev tools</desc><g font-family="-apple-system,BlinkMacSystemFont,Inter,Arial,sans-serif" data-motif="illustration-main"><text x="30" y="36" font-size="20" text-anchor="start" fill="#273A59" font-weight="780">Installable Python project</text><text x="30" y="60" font-size="12" text-anchor="start" fill="#6E83A1" font-weight="520">Create a venv and install PyTorch with dev tools</text><path d="M30 79H730" fill="none" stroke="#D5E1EF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><rect x="76" y="128" width="378" height="160" rx="10" fill="#fff" stroke="#96B3D1" stroke-width="1.5"/><rect x="76" y="128" width="378" height="29" rx="9" fill="#E6EFFA" stroke="none" stroke-width="0"/><circle cx="92" cy="142" r="4" fill="#D48F90" stroke="none" stroke-width="0"/><circle cx="105" cy="142" r="4" fill="#E0C679" stroke="none" stroke-width="0"/><circle cx="118" cy="142" r="4" fill="#82BEA4" stroke="none" stroke-width="0"/><text x="94" y="189" font-size="12" text-anchor="start" fill="#273A59" font-weight="620">python -m venv .venv</text><text x="94" y="219" font-size="12" text-anchor="start" fill="#273A59" font-weight="620">source .venv/bin/activate</text><text x="94" y="249" font-size="12" text-anchor="start" fill="#358F77" font-weight="620">python -m pip install -e ".[dev]"</text><path d="M465 209L548 209" fill="none" stroke="#446CB8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" /><path d="M542.1 212.8L548 209L542.1 205.2" fill="none" stroke="#446CB8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" /><path d="M568 160h50l20 2