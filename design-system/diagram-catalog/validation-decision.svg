<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="validation-decision-title validation-decision-desc" data-tl-diagram-type="validation-decision" data-design-version="1" preserveAspectRatio="xMidYMid meet"><title id="validation-decision-title">Future date validation</title><desc id="validation-decision-desc">Past and today are allowed; future dates are rejected. Simple fictional style reference, not a source-history claim.</desc><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".65" fill="#CFDFF1"/></pattern></defs><rect width="760" height="430" fill="#F9FBFE"/><rect width="760" height="430" fill="url(#dots)"/><path d="M0 120H760M0 240H760M0 360H760M120 0V430M240 0V430M360 0V430M480 0V430M600 0V430M720 0V430" stroke="#EEF3F9" stroke-width="1"/><g font-family="-apple-system,BlinkMacSystemFont,Inter,Arial,sans-serif" data-motif="illustration-main"><text x="32" y="39" text-anchor="start" fill="#26385E" font-size="21" font-weight="650">Future date validation</text><text x="32" y="60" text-anchor="start" fill="#6D83A7" font-size="12" font-weight="650">Past and today are allowed; future dates are rejected</text><path d="M30 78H729" fill="none" stroke="#d2e0f0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M87 224H677" fill="none" stroke="#a9bddb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="87" y="191" width="290" height="33" rx="0" fill="#e8f5ed" stroke="none" stroke-width="0"/><rect x="378" y="191" width="299" height="33" rx="0" fill="#fff0f2" stroke="none" stroke-width="0"/><path d="M378 162V274" fill="none" stroke="#26385E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6"/><circle cx="378" cy="224" r="10" fill="#fff" stroke="#5574C8" stroke-width="2"/><text x="378" y="155" text-anchor="middle" fill="#26385E" font-size="13" font-weight="650">TODAY</text><text x="220" y="210" text-anchor="middle" fill="#3E947B" font-size="13" font-weight="650">valid ≤ now()</text><text x="522" y="210" text-anchor="middle" fill="#CC5065" font-size="13" font-weight="650">future → invalid</text><g transform="translate(556 270) scale(0.72)"><path d="M37 1L69 15V46Q68 66 37 84Q6 66 5 46V15Z" fill="#fff7f8" stroke="#CC5065" stroke-width="2"/><path d="M23 31L51 55M51 31L23 55" fill="none" stroke="#CC5065" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="135" y="266" text-anchor="middle" fill="#6D83A7" font-size="12" font-weight="650">PAST</text><text x="628" y="266" text-anchor="middle" fill="#6D83A7" font-size="12" font-weight="650">FUTURE</text><rect x="449" y="103" width="167" height="29" rx="7" fill="#fff" stroke="#edc4cb" stroke-width="1"/><text x="532" y="122" text-anchor="middle" fill="#CC5065" font-size="12" font-weight="650">isAfter(currentDate)</text><path d="M531 137L531 174" fill="none" stroke="#CC5065" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" /><path d="M527.0 168.2L531 174L535.0 168.2" fill="none" stroke="#CC5065" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M30 386H729" fill="none" stroke="#d2e0f0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><text x="32" y="408" text-anchor="start" fill="#6D83A7" font-size="10" font-weight="650">THREE-LANES · LIGHTWEIGHT BLUEPRINT RECIPE</text></g></svg>